name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  owner-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require repository owner as PR author
        env:
          OWNER_ID: ${{ github.repository_owner_id }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          if (process.env.EVENT_NAME === 'pull_request' &&
              process.env.PR_AUTHOR_ID !== process.env.OWNER_ID) {
            console.error('Only the repository owner may submit ' +
              'a mergeable pull request.');
            process.exit(1);
          }
          NODE
  action:
    needs: owner-pr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Install checksum-pinned workflow validator
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          base=https://github.com/rhysd/actionlint/releases/download
          name=actionlint_1.7.12_linux_amd64.tar.gz
          curl --fail --location --retry 3 \
            "$base/v1.7.12/$name" --output "$archive"
          digest=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: taco3064/nibfin
          ref: 17c8b0da15c4368cf810968c1243a67a16687e02
          path: .test-producer
          persist-credentials: false
      - name: Prepare reviewed producer archive
        run: |
          npm ci --prefix .test-producer --ignore-scripts --no-bin-links \
            --no-audit --no-fund
          node tooling/test-input.mjs --build .test-producer
      - name: Check maintained source and run available product tests
        run: node tooling/check.mjs
      - name: Validate queue policy and all remaining workflow syntax
        run: node tooling/lint-workflows.mjs
