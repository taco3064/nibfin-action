name: Action release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nibfin-action-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'taco3064/nibfin-action' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: nibfin-release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Bind package to protected merged source
        env:
          NIBFIN_RELEASE_BASE: ${{ github.sha }}
          NIBFIN_RELEASE_COMMIT: ${{ github.sha }}
        run: node tooling/package.mjs
      # Publication preflight requires the exact integrated Core release from nibfin #203.
      - name: Publish and reconcile immutable release
        env:
          NIBFIN_RELEASE_TOKEN: ${{ secrets.NIBFIN_RELEASE_TOKEN }}
        run: node tooling/publish.mjs
      - name: Retain publication observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: action-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
