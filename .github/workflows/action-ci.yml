name: Action CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Install checksum-pinned workflow validator
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Validate GitHub workflow syntax and expressions
        run: actionlint -color -shellcheck= -pyflakes=
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: taco3064/nibfin
          ref: bda12320ab60a54d6145763e5950dcf88fa26f8c
          path: .test-producer
          persist-credentials: false
      - name: Prepare reviewed producer archive
        run: |
          npm ci --prefix .test-producer --ignore-scripts --no-bin-links --no-audit --no-fund
          node tooling/test-input.mjs --build .test-producer
      - name: Check maintained source and run available product tests
        run: node tooling/check.mjs
